apiVersion: v1
kind: ConfigMap
metadata:
  name: cli-proxy-api-nginx
  labels:
    app: cli-proxy-api
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location = / {
        default_type text/plain;
        return 200 "CLIProxyAPI is running.\n\nOpenAI-compatible API endpoint: http://localhost:8317/v1\nHealth check: http://localhost:8317/healthz\nManagement Center: http://localhost:8788/\n";
      }

      location /v1 {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:8317;
      }

      location /api/provider {
        auth_basic "CLIProxyAPI";
        auth_basic_user_file /etc/nginx/auth/users;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:8317;
      }

      location /v0/management {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8317;
      }
    }
