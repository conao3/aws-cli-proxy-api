apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cli-proxy-api-config
  labels:
    app: cli-proxy-api
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 1Gi
---
