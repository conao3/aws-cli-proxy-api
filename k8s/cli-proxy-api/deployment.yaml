apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  labels:
    app: cli-proxy-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      labels:
        app: cli-proxy-api
    spec:
      imagePullSecrets:
      - name: ecr-secret
      initContainers:
      - name: init-config
        image: busybox:1.37
        command:
        - sh
        - -c
        - |
          set -eu
          if [ ! -s /config/config.yaml ]; then
            cp /config-template/config.yaml /config/config.yaml
            chown 50001:50001 /config/config.yaml
            chmod 600 /config/config.yaml
          fi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: config-template
          mountPath: /config-template
          readOnly: true
      containers:
      - name: basic-auth-proxy
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        - name: basic-auth
          mountPath: /etc/nginx/auth
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
      - name: cli-proxy-api
        image: 249899228725.dkr.ecr.ap-northeast-1.amazonaws.com/dev-k8s-cli-proxy-api:latest
        ports:
        - name: app
          containerPort: 8317
        env:
        - name: TZ
          value: Asia/Tokyo
        volumeMounts:
        - name: config
          mountPath: /CLIProxyAPI/config.yaml
          subPath: config.yaml
        - name: auths
          mountPath: /root/.cli-proxy-api
        - name: logs
          mountPath: /CLIProxyAPI/logs
        readinessProbe:
          tcpSocket:
            port: 8317
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8317
          initialDelaySeconds: 15
          periodSeconds: 30
      volumes:
      - name: nginx-config
        configMap:
          name: cli-proxy-api-nginx
      - name: basic-auth
        secret:
          secretName: cli-proxy-api-basic-auth
      - name: config
        persistentVolumeClaim:
          claimName: cli-proxy-api-config
      - name: config-template
        secret:
          secretName: cli-proxy-api-config
      - name: auths
        persistentVolumeClaim:
          claimName: cli-proxy-api-auths
      - name: logs
        persistentVolumeClaim:
          claimName: cli-proxy-api-logs
