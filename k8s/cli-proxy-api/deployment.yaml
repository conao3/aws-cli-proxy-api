apiVersion: apps/v1
kind: Deployment
metadata:
  name: cli-proxy-api
  labels:
    app: cli-proxy-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cli-proxy-api
  template:
    metadata:
      labels:
        app: cli-proxy-api
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: cli-proxy-api
        image: 249899228725.dkr.ecr.ap-northeast-1.amazonaws.com/dev-k8s-cli-proxy-api:latest
        ports:
        - name: http
          containerPort: 8317
        env:
        - name: TZ
          value: Asia/Tokyo
        volumeMounts:
        - name: config
          mountPath: /CLIProxyAPI/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: auths
          mountPath: /root/.cli-proxy-api
        - name: logs
          mountPath: /CLIProxyAPI/logs
        readinessProbe:
          tcpSocket:
            port: 8317
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8317
          initialDelaySeconds: 15
          periodSeconds: 30
      volumes:
      - name: config
        secret:
          secretName: cli-proxy-api-config
      - name: auths
        persistentVolumeClaim:
          claimName: cli-proxy-api-auths
      - name: logs
        persistentVolumeClaim:
          claimName: cli-proxy-api-logs
