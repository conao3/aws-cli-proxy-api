version: 0.2

env:
  shell: bash

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        docker build \
          --build-arg CLI_PROXY_API_IMAGE="${CLI_PROXY_API_IMAGE:-$ECR_REGISTRY/${PREFIX}-cli-proxy-api:upstream}" \
          -t cli-proxy-api:latest .
        docker tag cli-proxy-api:latest "$ECR_REGISTRY/${PREFIX}-cli-proxy-api:latest"
        docker push "$ECR_REGISTRY/${PREFIX}-cli-proxy-api:latest"
