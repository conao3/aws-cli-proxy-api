version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euxo pipefail -o posix
        curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

  pre_build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        mkdir -p ~/.kube
        aws ssm get-parameter --name "${PREFIX}-kubeconfig" --with-decryption --query Parameter.Value --output text > ~/.kube/config
        chmod 600 ~/.kube/config

  build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        mkdir -p ~/.docker
        aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
        kubectl delete secret ecr-secret -n default --ignore-not-found
        kubectl create secret generic ecr-secret \
          --from-file=.dockerconfigjson="${HOME}/.docker/config.json" \
          --type=kubernetes.io/dockerconfigjson \
          -n default

        aws secretsmanager get-secret-value \
          --secret-id "${PREFIX}-secret" \
          --query SecretString \
          --output text > /tmp/cli-proxy-api-secret.json
        python3 scripts/render_config.py /tmp/cli-proxy-api-secret.json > /tmp/cli-proxy-api-config.yaml
        python3 scripts/render_basic_auth.py /tmp/cli-proxy-api-secret.json > /tmp/cli-proxy-api-basic-auth-users
        kubectl create secret generic cli-proxy-api-config \
          --from-file=config.yaml=/tmp/cli-proxy-api-config.yaml \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic cli-proxy-api-basic-auth \
          --from-file=users=/tmp/cli-proxy-api-basic-auth-users \
          --dry-run=client -o yaml | kubectl apply -f -

        cp -R k8s/cli-proxy-api /tmp/cli-proxy-api-k8s
        ENV_NAME="${ENV_NAME:-${PREFIX%%-*}}"
        if [[ "${ENV_NAME}" == "prd" ]]; then
          CLI_PROXY_API_HOST="cli-proxy-api.sancode.dev"
        else
          CLI_PROXY_API_HOST="${ENV_NAME}-cli-proxy-api.sancode.dev"
        fi
        sed -i \
          -e "s|dev-cli-proxy-api.sancode.dev|${CLI_PROXY_API_HOST}|g" \
          -e "s|249899228725.dkr.ecr.ap-northeast-1.amazonaws.com/dev-k8s-cli-proxy-api:latest|${ECR_REGISTRY}/${PREFIX}-cli-proxy-api:latest|g" \
          /tmp/cli-proxy-api-k8s/*.yaml

        kubectl apply -k /tmp/cli-proxy-api-k8s
        kubectl set image deployment/cli-proxy-api \
          cli-proxy-api="${ECR_REGISTRY}/${PREFIX}-cli-proxy-api:latest" \
          -n default
        kubectl rollout restart deployment/cli-proxy-api -n default
        kubectl rollout status deployment/cli-proxy-api -n default --timeout=300s
        rm -f /tmp/cli-proxy-api-secret.json /tmp/cli-proxy-api-config.yaml /tmp/cli-proxy-api-basic-auth-users
