version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euxo pipefail -o posix
        curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/arm64/kubectl"
        install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

  pre_build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        mkdir -p ~/.kube
        aws ssm get-parameter --name "${PREFIX}-kubeconfig" --with-decryption --query Parameter.Value --output text > ~/.kube/config
        chmod 600 ~/.kube/config

  build:
    on-failure: ABORT
    commands:
      - |
        set -euxo pipefail -o posix
        ECR_TOKEN=$(aws ecr get-login-password --region ap-northeast-1)
        kubectl delete secret ecr-secret -n default --ignore-not-found
        kubectl create secret docker-registry ecr-secret \
          --docker-server="${ECR_REGISTRY}" \
          --docker-username=AWS \
          --docker-password="${ECR_TOKEN}" \
          -n default

        SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "${PREFIX}-secret" --query SecretString --output text)
        CLI_PROXY_API_KEY=$(SECRET_JSON="${SECRET_JSON}" python3 -c 'import json, os; print(json.loads(os.environ["SECRET_JSON"])["cli-proxy-api-key"])')
        CLI_PROXY_MANAGEMENT_KEY=$(SECRET_JSON="${SECRET_JSON}" python3 -c 'import json, os; print(json.loads(os.environ["SECRET_JSON"]).get("cli-proxy-api-management-key", ""))')

        CLI_PROXY_API_KEY="${CLI_PROXY_API_KEY}" \
        CLI_PROXY_MANAGEMENT_KEY="${CLI_PROXY_MANAGEMENT_KEY}" \
          python3 scripts/render_config.py > /tmp/cli-proxy-api-config.yaml
        kubectl create secret generic cli-proxy-api-config \
          --from-file=config.yaml=/tmp/cli-proxy-api-config.yaml \
          --dry-run=client -o yaml | kubectl apply -f -

        kubectl apply -k k8s/cli-proxy-api
        kubectl set image deployment/cli-proxy-api \
          cli-proxy-api="${ECR_REGISTRY}/${PREFIX}-cli-proxy-api:latest" \
          -n default
        kubectl rollout status deployment/cli-proxy-api -n default --timeout=300s
